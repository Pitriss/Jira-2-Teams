name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential musl-tools musl-dev pkg-config dpkg-dev ca-certificates

      - name: Run full validation
        run: bash scripts/validate.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: jira2teams-debian-${{ github.sha }}
          path: dist/jira2teams_*_amd64.deb
          if-no-files-found: error
          retention-days: 7
