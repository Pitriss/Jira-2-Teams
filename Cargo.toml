[package]
name = "jira2teams"
version = "0.3.0"
edition = "2021"
description = "Jira watcher that sends one-to-one Microsoft Teams Personal messages"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[[bin]]
name = "jira2teams"
path = "src/main.rs"
